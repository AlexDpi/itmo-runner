 if(o.key==='achievement'){let a=o.achievement,x=o.x,y=o.y+bob;if(a.id==='honors'){rect(x+4,y+3,29,35,'#fff1c2');rect(x+9,y+9,18,3,'#ceaa64');rect(x+9,y+17,15,2,'#ceaa64');rect(x+9,y+23,18,2,'#ceaa64');rect(x+18,y+30,5,5,'#d85d67')}else if(a.id==='gto'){rect(x+7,y+2,24,9,'#57c3c8');rect(x+5,y+10,28,21,'#f4c44e');rect(x+10,y+14,18,13,'#39858c');text('Г',x+19,y+25,12,'#fff1c2')}else if(a.id==='volunteer'){rect(x+3,y+6,32,28,'#8c664b');rect(x+6,y+4,13,27,'#f4e8c8');rect(x+20,y+4,13,27,'#fff4db');rect(x+20,y+13,10,10,'#e77776');rect(x+23,y+10,4,16,'#e77776')}else if(a.id==='congress'){rect(x+18,y+2,5,31,'#efc84e');rect(x+5,y+7,30,25,'#7250a0');rect(x+10,y+12,20,14,'#ffd96c');text('★',x+20,y+24,14,'#6c4778')}else{rect(x+4,y+3,30,34,'#f2e2bd');rect(x+9,y+8,20,4,'#cf5d5c');rect(x+9,y+16,17,2,'#927a66');rect(x+9,y+21,19,2,'#927a66');rect(x+9,y+27,12,2,'#927a66');rect(x+25,y+30,8,5,'#d3a741')}return}
 if(o.key==='negativeSkill'){let a=o.skill;rect(o.x+1,o.y+bob+2,41,36,'#6e183e');rect(o.x+5,o.y+bob+5,33,30,'#ef405e');rect(o.x+8,o.y+bob+8,27,24,'#501c3e');text(a.icon,o.x+21,o.y+bob+27,21,'#ffcf55');rect(o.x+10,o.y+bob+10,5,3,'#ffd2b2');rect(o.x+27,o.y+bob+26,6,3,'#ffd2b2');text(a.name,o.x+20,o.y+bob-5,9,'#ffb7c2');return}if(o.key==='skill'){let a=o.skill;rect(o.x+3,o.y+bob+4,36,32,a.color);rect(o.x+6,o.y+bob+7,30,26,'#212742');text(a.icon,o.x+21,o.y+bob+27,19,a.color);text(a.name,o.x+20,o.y+bob-5,9,'#fff4d6');return}if(o.key==='campus'){rect(o.x+4,o.y+bob+4,28,27,'#ffd166');text('И',o.x+18,o.y+bob+24,16,'#51435a');return}let c=o.key==='rus'?'#fff0bc':o.key==='math'?'#79d1ff':'#70f0ce';rect(o.x+7,o.y+bob+4,22,22,c);rect(o.x+11,o.y+bob,14,30,c);text(o.key==='rus'?'К':o.key==='math'?'π':'0',o.x+18,o.y+bob+21,13,'#27223b')}
function drawObstacle(o){if(o.type==='box'){rect(o.x+3,o.y+4,o.w,o.h,'#263047');rect(o.x,o.y,o.w,o.h,'#9c5364');rect(o.x+5,o.y+6,o.w-10,7,'#f3b749')}else{rect(o.x+8,o.y,o.w-16,o.h,'#ed7b54');rect(o.x,o.y+o.h-8,o.w,8,'#783e50')}}function overlay(a,b){rect(0,0,W,H,'rgba(20,17,39,.69)');text(a,W/2,210,34,'#ffd166');text(b,W/2,257,18,'#fff4d6')}
function startNormalExams(){examChoiceMode=false;examBox.classList.remove('visible');phaseList=[{type:'exam',subject:'rus',name:'ЕГЭ: РУССКИЙ ЯЗЫК',seconds:20},{type:'exam',subject:'math',name:'ЕГЭ: МАТЕМАТИКА',seconds:20},{type:'exam',subject:'info',name:'ЕГЭ: ИНФОРМАТИКА',seconds:20},{type:'spb',name:'САНКТ-ПЕТЕРБУРГ — СОБИРАЙ КОМПЕТЕНЦИИ',seconds:42},{type:'itmo',name:'ИТМО — ВЫБОР ПРОГРАММЫ',seconds:32}];phaseIndex=0;phaseTime=0;objects=[];obstacles=[];spawnTimer=0;nextExamPenaltyAt=5+Math.random()*1.5}
function beginExamFlow(){if(olympiadWon&&!bviCancelled){examChoiceMode=true;examBox.classList.add('visible');document.getElementById('examPrompt').textContent='Олимпиада выиграна. Выбери один ЕГЭ — математику или информатику — и набери 75+ для подтверждения БВИ.';objects=[];obstacles=[];return}startNormalExams()}
function chooseExam(subject){examChoiceMode=false;examBox.classList.remove('visible');examSubject=subject;score[subject]=0;bviPending=true;phaseList=[{type:'exam',subject,name:'ЕГЭ: '+(subject==='math'?'МАТЕМАТИКА':'ИНФОРМАТИКА')+' — ПРОВЕРКА БВИ',seconds:20},{type:'spb',name:'САНКТ-ПЕТЕРБУРГ — СОБИРАЙ КОМПЕТЕНЦИИ',seconds:42},{type:'itmo',name:'ИТМО — ВЫБОР ПРОГРАММЫ',seconds:32}];phaseIndex=0;phaseTime=0;objects=[];obstacles=[];spawnTimer=0;nextExamPenaltyAt=5+Math.random()*1.5;els.status.textContent='Нужно 75+ по выбранному экзамену; меньше 60 — поражение.'}
function failBecauseLow(){els.status.textContent='МЕНЬШЕ 60 БАЛЛОВ — ПОРАЖЕНИЕ. ПОПРОБУЙ ЕЩЁ РАЗ.';finish(false)}
function finishExam(){let current=phaseList[phaseIndex];if(current?.type==='exam'&&score[current.subject]<60){failBecauseLow();return}if(bviPending&&current?.type==='exam'){if(score[examSubject]>=75&&!bviCancelled){bviGranted=true;score.rus=100;score.math=100;score.info=100;els.status.textContent='БВИ ЗАСЧИТАНА! ПУТЬ ПРОДОЛЖАЕТСЯ.';bviPending=false;examMode=false;phaseList=[{type:'spb',name:'САНКТ-ПЕТЕРБУРГ — СОБИРАЙ КОМПЕТЕНЦИИ',seconds:42},{type:'itmo',name:'ИТМО — ВЫБОР ПРОГРАММЫ',seconds:32}];phaseIndex=0;phaseTime=0;objects=[];obstacles=[];spawnTimer=0;renderHud();return}else{bviPending=false;olympiadWon=false;bviGranted=false;els.status.textContent='БВИ НЕ ЗАСЧИТАНА. ИДЁТ ОБЫЧНЫЙ МАРШРУТ ЕГЭ.';startNormalExams();return}}phaseIndex++;phaseTime=0;objects=[];obstacles=[];spawnTimer=0;if(phaseIndex>=phaseList.length){finish(false);return}if(phaseList[phaseIndex].type==='itmo')showPrograms()}
function eligible(p){const total=score.rus+score.math+score.info+score.ach;return total>=p.points&&p.skills.every(id=>skills.has(id))&&negativeSkills.size===0}
function showPrograms(){
 programChoiceMode=true;programBox.classList.add('visible');programGrid.innerHTML='';
 const total=score.rus+score.math+score.info+score.ach;
 const available=programs.filter(p=>eligible(p));
 const prompt=document.getElementById('programPrompt');
 if(!available.length){prompt.textContent='Ни одна программа пока не подходит. А может попробовать сдать физику?';return}
 prompt.textContent='Выбери доступную образовательную программу:';
 for(const p of available){const b=document.createElement('button');b.type='button';b.textContent=`${p.name.slice(0,8)} • ${p.points}`;b.addEventListener('click',()=>{if(!eligible(p))return;programSelected=p.name;selectedProgramUrl=p.url;programGrid.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));prompt.textContent=`Выбрано: ${p.name.slice(0,8)}. Нажми «Завершить путь».`;startBtn.textContent='ЗАВЕРШИТЬ ПУТЬ';});programGrid.appendChild(b)}
}
function finish(won){running=false;ended=true;programChoiceMode=false;examBox.classList.remove('visible');programBox.classList.remove('visible');bviControls.classList.remove('active');let total=score.rus+score.math+score.info+score.ach;drawBackground(won?'itmo':'grade');drawHero();overlay(won?'ФИНИШ: ИТМО!':'ЗАБЕГ ОКОНЧЕН',won?`${total} / 310 • ${programSelected}`:`${total} / 310 • НАЖМИ «ЗАНОВО»`);els.stage.textContent=won?'ФИНИШ — ИТМО':'ПОРАЖЕНИЕ';els.progress.style.width='100%';if(won&&selectedProgramUrl){const link=document.createElement('a');link.href=selectedProgramUrl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='УЗНАТЬ ПОДРОБНЕЕ';link.className='detail-link';const controls=document.querySelector('.controls');controls.insertBefore(link,startBtn)}if(!won)startBtn.textContent='ПОПРОБОВАТЬ СНОВА'}
function onCollect(o){if(o.key==='bad'){if(o.olympiad){bviCancelled=true;bviGranted=false;olympiadWon=false;bviPending=false;els.status.textContent='АНТИНАГРАДА: '+o.label+' — БВИ ОТМЕНЕНА!';}else{let kind=phaseList[phaseIndex]?.type==='exam'?phaseList[phaseIndex].subject:'';if(kind){score[kind]=Math.max(0,score[kind]-o.value);els.status.textContent=o.label+'  −'+o.value+' баллов'}}return}if(o.key==='medal'){medalCount++;for(let i=0;i<8;i++)particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*150,vy:-100-Math.random()*150,t:.6,c:'#ffd166'});if(medalCount>=5){olympiadWon=true;bviMode=false;bviControls.classList.remove('active');hero.x=155;laneIndex=0;objects=objects.filter(o=>o.key!=='medal'&&!(o.key==='bad'&&o.olympiad));obstacles=[];els.status.textContent='ОЛИМПИАДА ВЫИГРАНА! НУЖЕН ЕГЭ 75+.'}return}if(o.key==='achievement'){if(!collectedAchievements.has(o.achievement.id)){collectedAchievements.add(o.achievement.id);score.ach=Math.min(10,Math.round((score.ach+o.achievement.points)*10)/10);els.status.textContent=o.achievement.name+' +'+o.achievement.points}return}if(o.key==='negativeSkill'){spawnedSkills.add(o.skill.id);if(skills.has(o.skill.antagonist)){els.status.textContent=o.skill.name+' УЖЕ ЗАКРЫТА КОМПЕТЕНЦИЕЙ '+(skillTypes.find(x=>x.id===o.skill.antagonist)?.name||'АНТАГОНИСТА');}else{negativeSkills.add(o.skill.id);els.status.textContent='ОТРИЦАТЕЛЬНАЯ КОМПЕТЕНЦИЯ: '+o.skill.name+' — ПОЙМАЙ '+(skillTypes.find(x=>x.id===o.skill.antagonist)?.name||'АНТАГОНИСТА')+' ДЛЯ ЗАКРЫТИЯ';}return}if(o.key==='skill'){spawnedSkills.add(o.skill.id);if(!skills.has(o.skill.id)){skills.add(o.skill.id);if(o.skill.counters){for(const id of o.skill.counters){if(negativeSkills.delete(id)){els.status.textContent=o.skill.name+' ЗАКРЫЛА ОТРИЦАТЕЛЬНУЮ КОМПЕТЕНЦИЮ';}}}spbMarks++;if(!o.skill.counters?.some(id=>!negativeSkills.has(id)))els.status.textContent='КОМПЕТЕНЦИЯ: '+o.skill.name}return}if(o.key==='campus'){itmoMarks++;return}if(['rus','math','info'].includes(o.key)){let award=bviPending&&phaseList[phaseIndex]?.type==='exam'?25:20;score[o.key]=Math.min(100,score[o.key]+award)}}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;if(examChoiceMode){drawBackground(kind());drawHero();overlay('ОЛИМПИАДА ВЫИГРАНА','ВЫБЕРИ ОДИН ЕГЭ: МАТЕМАТИКА ИЛИ ИНФОРМАТИКА');requestAnimationFrame(loop);return}if(bviMode)bviTime+=dt;else{phaseTime+=dt;if(phaseIndex===0)runTime+=dt}distance+=dt*285;spawnTimer+=dt;obstacleTimer+=dt;
 if(!bviMode&&!bviUsed&&bviChance&&runTime>=randomBviAt&&phaseIndex===0){bviMode=true;bviUsed=true;bviTime=0;medalCount=0;objects=[];obstacles=[];laneIndex=1;hero.x=455;bviControls.classList.add('active');els.status.textContent='ЕДИНСТВЕННАЯ ПОПЫТКА: ПЕРЕМЕЩАЙСЯ МЕЖДУ ДОРОЖКАМИ И СОБЕРИ 5 МЕДАЛЕЙ.'}
 if(bviMode&&bviTime>=12){bviMode=false;bviControls.classList.remove('active');hero.x=155;laneIndex=0;objects=[];obstacles=[];if(!olympiadWon)els.status.textContent='ПОПЫТКА БВИ УПУЩЕНА. ПОВТОРА НЕ БУДЕТ.'}
 if(!bviMode&&phaseTime>=(phaseList[phaseIndex]?.seconds||1)){if(phaseList[phaseIndex]?.type==='grade'){if(!bviChance)bviUsed=true;phaseTime=0;beginExamFlow()}else if(phaseList[phaseIndex]?.type==='exam'){finishExam()}else if(phaseList[phaseIndex]?.type==='itmo'){if(!programChoiceMode)showPrograms();if(programSelected){finish(true);return}phaseTime=phaseList[phaseIndex].seconds-1}else finishExam()}
 if(!running)return;let k=kind();if(spawnTimer>(bviMode?1.05+Math.random()*.3:(['rus','math','info'].includes(kind())?.38:.55))){spawnTimer=0;spawnItem()}if(obstacleTimer>(bviMode?.88:1.5)+Math.random()*.35){obstacleTimer=0;spawnObstacle()}
 hero.vy+=1500*dt;hero.y+=hero.vy*dt;if(hero.y>=GROUND-64){hero.y=GROUND-64;hero.vy=0;hero.onGround=true}let speed=290;objects.forEach(o=>{if(o.key==='medal'||(o.key==='bad'&&o.olympiad)){o.y+=o.vy*dt;o.x+=Math.sin(distance*.02+o.phase)*12*dt}else o.x-=speed*dt});obstacles.forEach(o=>o.x-=speed*dt);objects=objects.filter(o=>(o.key==='medal'||(o.key==='bad'&&o.olympiad)?o.y<GROUND+30:o.y<H+40)&&o.x>-100&&o.x<W+100);
 objects=objects.filter(o=>{let ow=o.key==='medal'||o.key==='bad'?38:o.key==='skill'||o.key==='achievement'?42:34,oh=o.key==='medal'||(o.key==='bad'&&o.olympiad)?36:42;if(o.x+ow>hero.x+2&&o.x<hero.x+hero.w&&o.y+oh>hero.y+4&&o.y<hero.y+hero.h){onCollect(o);return false}return true});obstacles.forEach(o=>{if(!o.hit&&performance.now()>invulnerableUntil&&hero.x+37>o.x&&hero.x+5<o.x+o.w&&hero.y+60>o.y){o.hit=true;lives--;invulnerableUntil=performance.now()+1100;if(lives<=0){lives=3;obstacles=[];els.status.textContent='ПЕРЕДЫШКА — ЗАБЕГ ПРОДОЛЖАЕТСЯ'}}});
 renderHud();drawBackground(k);objects.forEach(drawItem);obstacles.forEach(drawObstacle);drawHero();if(k==='spb'){text('САНКТ-ПЕТЕРБУРГ',W/2,36,22,'#fff4d6');text('СОБИРАЙ РАЗНЫЕ КОМПЕТЕНЦИИ',W/2,67,13,'#fff4d6')}if(k==='itmo'){text('ИТМО — ВЫБЕРИ ПРОГРАММУ',W/2,42,20,'#fff4d6')}if(bviMode){text('БВИ: МЕДАЛИ '+medalCount+'/5',W/2,47,22,'#ffd166');text('КРАСНЫЕ АНТИНАГРАДЫ ОТМЕНЯЮТ БВИ!',W/2,77,14,'#fff4d6')}requestAnimationFrame(loop)}
function drawStart(){drawBackground('grade');drawHero();overlay('МАРШРУТ ДО ИТМО','БЕГИ, ПРЫГАЙ И СОБИРАЙ БАЛЛЫ')}document.querySelectorAll('[data-exam]').forEach(b=>b.addEventListener('click',()=>chooseExam(b.dataset.exam)));drawStart();
})();
